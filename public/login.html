<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — SimpleShop</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <!-- ===== navbar ===== -->
  <nav class="navbar">
    <div class="nav-container">
      <a href="/index.html" class="logo">🛍️ SimpleShop</a>
      <div class="nav-links">
        <a href="/index.html">Home</a>
        <a href="/orders.html">My Orders</a>
        <a href="/cart.html">Cart <span class="cart-badge" id="cart-badge">0</span></a>
        <span id="auth-area"></span>
      </div>
    </div>
  </nav>

  <!-- ===== login form ===== -->
  <main class="container">
    <div class="form-card auth-card">
      <h2>Welcome back 👋</h2>
      <p class="form-sub">Log in to your account</p>

      <form onsubmit="doLogin(event)">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="you@example.com" required>

        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Your password" required>

        <p class="error-msg" id="error-msg"></p>
        <button type="submit" class="btn big full">Login</button>
      </form>

      <p class="form-switch">New here? <a href="/register.html">Create an account</a></p>
    </div>
  </main>

  <script src="/js/main.js"></script>
  <script>
    async function doLogin(event) {
      event.preventDefault();

      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          email: document.getElementById('email').value,
          password: document.getElementById('password').value
        })
      });
      const data = await res.json();

      if (data.user) {
        window.location.href = '/index.html';
      } else {
        document.getElementById('error-msg').textContent = data.error || 'Login failed';
      }
    }
  </script>
</body>
</html>
