<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Cart — SimpleShop</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <!-- ===== navbar ===== -->
  <nav class="navbar">
    <div class="nav-container">
      <a href="/index.html" class="logo">🛍️ SimpleShop</a>
      <div class="nav-links">
        <a href="/index.html">Home</a>
        <a href="/orders.html">My Orders</a>
        <a href="/cart.html">Cart <span class="cart-badge" id="cart-badge">0</span></a>
        <span id="auth-area"></span>
      </div>
    </div>
  </nav>

  <!-- ===== cart ===== -->
  <main class="container">
    <h2>Your Cart</h2>
    <div id="cart-box">
      <p>Loading cart...</p>
    </div>
  </main>

  <!-- ===== footer ===== -->
  <footer class="footer">
    <p>SimpleShop — a simple e-commerce demo 🛒</p>
  </footer>

  <script src="/js/main.js"></script>
  <script>
    async function loadCart() {
      const box = document.getElementById('cart-box');
      const cart = getCart();

      // nothing in the cart yet
      if (cart.length === 0) {
        box.innerHTML = `
          <div class="empty-state">
            <p>Your cart is empty 🛒</p>
            <a href="/index.html" class="btn">Go Shopping</a>
          </div>`;
        return;
      }

      // simple way to get product info: load ALL products and match them
      const res = await fetch('/api/products');
      const products = await res.json();

      let total = 0;
      const rows = cart.map(item => {
        const p = products.find(prod => prod.id === item.id);
        if (!p) return ''; // this product doesn't exist anymore
        const subtotal = p.price * item.qty;
        total += subtotal;
        return `
          <div class="cart-item">
            <div class="mini-thumb" style="background: ${p.color}">${p.emoji}</div>
            <div class="cart-info">
              <h3>${p.name}</h3>
              <p>$${p.price.toFixed(2)} each</p>
            </div>
            <div class="qty-row">
              <button class="qty-btn" onclick="changeQty(${p.id}, -1)">-</button>
              <span>${item.qty}</span>
              <button class="qty-btn" onclick="changeQty(${p.id}, 1)">+</button>
            </div>
            <p class="line-total">$${subtotal.toFixed(2)}</p>
            <button class="btn-danger" onclick="removeItem(${p.id})">Remove</button>
          </div>`;
      }).join('');

      box.innerHTML = rows + `
        <div class="cart-summary">
          <h3>Total: $${total.toFixed(2)}</h3>
          <button class="btn big" onclick="goToCheckout()">Proceed to Checkout</button>
        </div>`;
    }

    // increase or decrease the quantity of one cart item
    function changeQty(id, delta) {
      const cart = getCart();
      const item = cart.find(i => i.id === id);
      if (!item) return;
      item.qty += delta;
      if (item.qty < 1) item.qty = 1; // minimum is 1 (use Remove to delete)
      saveCart(cart);
      loadCart(); // draw the cart again with the new numbers
    }

    // take one product out of the cart
    function removeItem(id) {
      saveCart(getCart().filter(i => i.id !== id));
      loadCart();
    }

    // only let logged in users go to the checkout
    async function goToCheckout() {
      const res = await fetch('/api/me');
      const data = await res.json();
      if (!data.user) {
        alert('Please log in (or sign up) before checking out 🙂');
        window.location.href = '/login.html';
        return;
      }
      window.location.href = '/checkout.html';
    }

    loadCart();
  </script>
</body>
</html>
